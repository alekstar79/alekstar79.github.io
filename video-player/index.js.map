export default "<div class=\"preview\">\n  <div class=\"preview__handle\">\n    <button class=\"preview__close-btn\" title=\"Close\">&times;</button>\n  </div>\n\n  <div class=\"preview__content\">\n    <div class=\"preview__image-wrapper\">\n      <img class=\"preview__image\" style=\"display: none;\"  alt=\"\" src=\"\"/>\n      <div class=\"preview__placeholder\">No preview</div>\n      <span class=\"preview__timestamp\" data-info=\"timestamp\"></span>\n    </div>\n\n    <div class=\"preview__details\">\n      <div class=\"info-item info-item--full-width\">\n        <span class=\"info-label\">Name:</span>\n        <span class=\"info-value\" data-info=\"filename\">-</span>\n      </div>\n\n      <div class=\"info-item\">\n        <span class=\"info-label\">Resolution:</span>\n        <span class=\"info-value\" data-info=\"resolution\">-</span>\n      </div>\n\n      <div class=\"info-item\">\n        <span class=\"info-label\">Size:</span>\n        <span class=\"info-value\" data-info=\"size\">-</span>\n      </div>\n\n      <div class=\"preview__actions\">\n        <button class=\"preview__btn preview__btn--generate\">Generate</button>\n        <button class=\"preview__btn preview__btn--save\">Save</button>\n      </div>\n    </div>\n  </div>\n</div>\n"
