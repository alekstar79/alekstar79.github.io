export default "<div class=\"player\">\n  <div class=\"player__no-files-message\">No video files to play</div>\n  <div class=\"player__source-title\"></div>\n\n  <span class=\"player__main-icon j-pause\"><span class=\"icon-container\"></span></span>\n  <span class=\"player__main-icon j-play\"><span class=\"icon-container\"></span></span>\n\n  <video class=\"player__video\"></video>\n\n  <button\n    class=\"player__source-nav player__source-nav--prev j-source-prev\"\n    title=\"Previous source\"\n  >\n    <span class=\"icon-container\"></span>\n  </button>\n  <button\n    class=\"player__source-nav player__source-nav--next j-source-next\"\n    title=\"Next source\"\n  >\n    <span class=\"icon-container\"></span>\n  </button>\n\n  <div class=\"player__top-panel\">\n    <preview-button></preview-button>\n    <playlist-button></playlist-button>\n  </div>\n\n  <div class=\"player__panel\">\n    <timeline-control class=\"j-line\"></timeline-control>\n\n    <div class=\"player__panel-block\">\n      <skip-button class=\"j-skip-backward\" direction=\"backward\" title=\"Skip backward\"></skip-button>\n      <open-file-button class=\"j-open-file\"></open-file-button>\n      <loop-button class=\"j-toggle-loop\"></loop-button>\n      <play-pause-button class=\"j-toggle-video\"></play-pause-button>\n      <skip-button class=\"j-skip-forward\" direction=\"forward\" title=\"Skip forward\"></skip-button>\n      <volume-control class=\"j-toggle-volume\"></volume-control>\n      <time-display class=\"j-duration\"></time-display>\n    </div>\n\n    <div class=\"player__panel-block\">\n      <speed-options class=\"j-speed\"></speed-options>\n      <pip-button class=\"j-pic-in-pic\"></pip-button>\n      <fullscreen-button class=\"j-fullscreen\"></fullscreen-button>\n    </div>\n  </div>\n\n  <playlist-panel></playlist-panel>\n  <preview-panel></preview-panel>\n</div>\n"
