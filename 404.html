<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Перенаправление...</title>
  <script>
    ;(function() {
      const path = window.location.pathname
      const segments = path.split('/').filter(Boolean)

      if (segments.length === 0) return

      const subfolder = segments[0]

      try {
        sessionStorage.setItem('spa-redirect', path + window.location.search + window.location.hash)
      } catch(e) {/* ignore */}

      window.location.replace('/' + subfolder + '/')
    })()
  </script>
</head>
<body></body>
</html>
