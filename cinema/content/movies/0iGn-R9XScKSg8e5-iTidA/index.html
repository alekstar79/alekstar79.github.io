:720,"versions":724,"show_counter":48},"В России более 1000 музеев. Каждый из них по-своему уникален. Музеи искусства, техники, науки, спорта, истории. Сколько секретов и тайн они хранят, сколько невероятных историй скрывается за каждым предметом. Однако огромное внимание привлекает Музей Мирового океана в Калининграде, ведь именно океан изучен даже меньше, чем просторы космоса. Фонд хранит более 80 000 предметов. Здесь собраны коллекции фотографий, документов, раковины моллюсков, письменные источники, относящиеся к самым разным временам и событиям.\r\nКак много вы знаете про мировой океан? Считается, что про поверхность Марса изучена подробнее, чем морские глубины, однако, сведения медленно, но верно накапливаются вместе со все новыми исследованиями Земли. Познакомиться с ними можно в фильме Российского общества «Знание» о музее Мирового океана. Экспозиция собрала под одной крышей коллекции раковин моллюсков и живых рыб, геологические образцы, морские карты и даже научно-исследовательское судно-музей «Витязь», с которого впервые измерили глубину Марианской впадины. Готовы окунуться в подводный мир с головой? Тогда смело начинайте просмотр!",[625],"studio:1",[627],"country:1",[629,642,654],{"oid":630,"person":631,"job":641,"character":48},"participant:19",{"oid":632,"url":633,"first_name":634,"last_name":635,"assets":636},"person:5","\u002Fperson\u002F5\u002F","Кирилл","Степанчук",[637],{"oid":638,"asset_type":639,"resize_url":640},"asset:22","Photo","https:\u002F\u002Fi.test.ksfr.tech\u002Fmedia\u002Fcms\u002F{w}x{h}\u002Fmetadata\u002Fperson\u002F5\u002Fea88a5efa6da43649df39c08f61069bd.jpg","job:8",{"oid":643,"person":644,"job":653,"character":48},"participant:20",{"oid":645,"url":646,"first_name":647,"last_name":648,"assets":649},"person:6","\u002Fperson\u002F6\u002F","Ирина","Байкова",[650],{"oid":651,"asset_type":639,"resize_url":652},"asset:21","https:\u002F\u002Fi.test.ksfr.tech\u002Fmedia\u002Fcms\u002F{w}x{h}\u002Fmetadata\u002Fperson\u002F6\u002F874a8cd661
