<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AG-GRID Examples</title>
  <link rel="shortcut icon" href="/ag-grid/favicon.png" type="image/png">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=JetBrains+Mono&display=swap"
    rel="stylesheet"
  >
  <script>
    ;(function(l) {
      if (l.search[1] === '/' ) {
        const decoded = l.search.slice(1).split('&').map((s) => {
          return s.replace(/~and~/g, '&')
        }).join('?')

        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        )
      }
    }(window.location))

    ;(function() {
      try {
        const redirect = sessionStorage.getItem('spa-redirect')

        if (redirect) {
          sessionStorage.removeItem('spa-redirect')

          if (typeof redirect === 'string' &&
            redirect.startsWith('/ag-grid/') &&
            !redirect.includes('://') &&
            !redirect.startsWith('//') &&
            !redirect.includes('\\')) {
            window.history.replaceState(null, '', redirect)
          }
        }
      } catch (e) {}
    })()
  </script>
  <script type="module" crossorigin src="/ag-grid/assets/index-Bc4Mc_9k.js"></script>
  <link rel="stylesheet" crossorigin href="/ag-grid/assets/index-DkmolkP9.css">
</head>
<body>
  <div id="app"></div>
</body>
</html>
