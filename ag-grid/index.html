<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AG-GRID Examples</title>
  <link rel="shortcut icon" href="/ag-grid/favicon.png" type="image/png">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=JetBrains+Mono&display=swap"
    rel="stylesheet"
  >
  <script>
    ;(function() {
      try {
        const redirect = sessionStorage.getItem('spa-redirect')

        if (redirect) {
          sessionStorage.removeItem('spa-redirect')

          if (typeof redirect === 'string' &&
            redirect.startsWith('/ag-grid/') &&
            !redirect.includes('://') &&
            !redirect.startsWith('//') &&
            !redirect.includes('\\')) {
            window.history.replaceState(null, '', redirect)
          }
        }
      } catch (e) {}
    })();
  </script>
